name: Build Clean APK with Icon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Build APK with Icon
        run: |
          npm install -g cordova
          
          # 1. Create Cordova project
          cordova create app com.flow.tm "FC Maker"
          
          # 2. Copy ALL HTML and web files to www folder
          cp -r *.html *.png *.jpg *.jpeg *.css *.js app/www/ 2>/dev/null || true
          
          # 3. Move to app directory
          cd app
          
          # Handle custom icon if it exists
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
          fi
          
          # 4. Safely add permission and preference using a secure single-line python parser
          python3 -c '
          import xml.etree.ElementTree as ET
          ET.register_namespace("", "http://www.w3.org/ns/widgets")
          tree = ET.parse("config.xml")
          root = tree.getroot()
          
          # Add preference for file mode overhead
          pref = ET.Element("preference", {"name": "AndroidInsecureFileModeOverhead", "value": "true"})
          root.append(pref)
          
          # Add edit-config for storage permission
          edit_config = ET.Element("edit-config", {
              "file": "app/src/main/AndroidManifest.xml",
              "mode": "merge",
              "target": "/manifest/uses-permission[@name=\"android.permission.WRITE_EXTERNAL_STORAGE\"]"
          })
          uses_perm = ET.Element("uses-permission", {"android:name": "android.permission.WRITE_EXTERNAL_STORAGE", "android:maxSdkVersion": "28"})
          edit_config.append(uses_perm)
          root.append(edit_config)
          
          tree.write("config.xml", encoding="utf-8", xml_declaration=True)
          '
          
          # 5. Add Android Platform & Build
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TM-APP-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
