name: Build Clean APK with Icon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Build APK with Icon
        run: |
          npm install -g cordova

          # 1. Create Cordova project
          cordova create app com.flowmaker.tm "FLOWCHART MAKER"

          # 2. Copy ALL HTML and web files to www folder
          cp -r *.html *.png *.jpg *.jpeg *.css *.js app/www/ 2>/dev/null || true

          # 3. Add Custom Icon to Config if icon.png exists
          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' app/config.xml
          fi

          cd app

          # 4. Add plugins needed for saving / downloading files
          cordova plugin add cordova-plugin-file
          cordova plugin add cordova-plugin-file-opener2

          # 5. Add Android platform
          cordova platform add android

          # 6. Inject storage permissions + legacy storage flag into AndroidManifest.xml
          python3 << 'EOF'
import os

path = 'platforms/android/app/src/main/AndroidManifest.xml'
if not os.path.exists(path):
    raise SystemExit('Manifest not found: ' + path)

with open(path, 'r') as f:
    content = f.read()

perms = (
    '    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
    '    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n'
    '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n'
)

# add permissions once, right before <application
if 'WRITE_EXTERNAL_STORAGE' not in content:
    content = content.replace('<application', perms + '    <application', 1)

# add legacy storage flag for Android 10 so Download/ folder writes work
content = content.replace(
    '<application',
    '<application android:requestLegacyExternalStorage="true"',
    1
) if 'requestLegacyExternalStorage' not in content else content

with open(path, 'w') as f:
    f.write(content)

print('Manifest patched successfully')
EOF

          # 7. Build
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TM-APP-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
