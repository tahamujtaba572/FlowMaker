name: Build LUMINA APK with Gallery Export

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App and Install Gallery Plugin
        run: |
          cordova create app com.flow.mt "FC Maker"
          cd app
          cordova platform add android@13.0.0
          cordova plugin add https://github.com/boogie/cordova-plugin-boogie-photosapi.git

      - name: Copy Website Files
        run: |
          mkdir -p app/www
          cp -R www/. app/www/

          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
            python3 - <<'PY'
          from pathlib import Path
          p = Path("app/config.xml")
          xml = p.read_text(encoding="utf-8")
          xml = xml.replace("</widget>", '    <icon src="www/icon.png" />\n</widget>')
          p.write_text(xml, encoding="utf-8")
          PY
          fi

      - name: Build Android APK
        run: |
          cd app
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LUMINA-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
