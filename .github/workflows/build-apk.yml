name: Build LUMINA APK with Gallery Export

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App and Install Gallery Plugin
        run: |
          cordova create app com.flow.tm "FC Maker"
          cd app
          cordova platform add android@13.0.0
          cordova plugin add https://github.com/boogie/cordova-plugin-boogie-photosapi.git

      - name: Copy Website Files from Repository Root
        run: |
          mkdir -p app/www
          # Copy all files from the repository root (where index.html currently lives).
          find . -maxdepth 1 -type f ! -name 'README.md' -exec cp -t app/www/ {} +
          # Copy root-level asset folders if the project has any.
          for folder in css js assets images; do
            if [ -d "$folder" ]; then cp -R "$folder" app/www/; fi
          done

          if [ -f "icon.png" ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path("app/config.xml")
          xml = p.read_text(encoding="utf-8")
          icon_line = '    <icon src="www/icon.png" />'
          if icon_line not in xml:
              xml = xml.replace("</widget>", icon_line + "\n</widget>")
          p.write_text(xml, encoding="utf-8")
          PY
          fi

      - name: Verify Web App Files
        run: |
          test -f app/www/index.html || (echo 'ERROR: index.html was not found in the repository root.' && exit 1)
          ls -la app/www

      - name: Build Android APK
        run: |
          cd app
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAHA-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
