name: Build Clean APK with Icon

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Build APK with Icon
        run: |
          npm install -g cordova
          
          # 1. Create Cordova project
          cordova create app com.flow.tm "FC Maker"
          
          # 2. Copy ALL HTML and web files to www folder
          cp -r *.html *.png *.jpg *.jpeg *.css *.js app/www/ 2>/dev/null || true
          
          # 3. Move to app directory
          cd app
          
          # Handle custom icon if it exists
          if [ -f "../icon.png" ]; then
            cp ../icon.png www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' config.xml
          fi
          
          # Safely append storage permissions & preferences right before </widget> using Python
          python3 -c '
          with open("config.xml", "r") as f:
              content = f.read()
          
          snippet = """
              <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/uses-permission[@name=\\"android.permission.WRITE_EXTERNAL_STORAGE\\"]">
                  <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              </edit-config>
              <preference name="AndroidInsecureFileModeOverhead" value="true" />
          </widget>
          """
          
          # Replace </widget> cleanly with our snippet which already contains </widget> at the end
          if "</widget>" in content:
              content = content.replace("</widget>", snippet, 1)
          
          with open("config.xml", "w") as f:
              f.write(content)
          '
          
          # 4. Add Android Platform & Build
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TM-APP-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
